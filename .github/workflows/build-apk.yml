name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www/adhan
          [ -e index.html ] || touch index.html
          [ -e www/index.html ] || touch www/index.html
          for f in adhan-*.mp3; do
            [ -e "$f" ] || continue
            cp "$f" "www/adhan/${f#adhan-}"
          done

      - run: npm install

      - run: npx cap add android

      - name: Android setup
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          R='android/app/src/main/res/mipmap-'
          for d,a,f in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              for n,s,src in [('ic_launcher.png',a,'icon.png'),('ic_launcher_round.png',a,'icon.png'),('ic_launcher_foreground.png',f,'icon-fg.png')]:
                  p=R+d+'/'+n
                  if os.path.exists(p):
                      Image.open(src).convert('RGBA').resize((s,s)).save(p)
          open('android/app/src/main/res/values/ic_launcher_background.xml','w').write('#0b3a47')
          PY
          R=android/app/src/main/res
          mkdir -p $R/raw $R/values-ar
          for f in adhan-*.mp3; do
            [ -e "$f" ] || continue
            n=${f#adhan-}
            cp "$f" "$R/raw/adhan_${n//-/_}"
          done
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Muslim</string>#' $R/values/strings.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">مسلم</string>\n</resources>\n' > $R/values-ar/strings.xml

      - run: npx cap sync android

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: muslim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
