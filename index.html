<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسلم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Almarai:wght@400;700&family=Cairo:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Noto+Naskh+Arabic:wght@500;700&family=Reem+Kufi:wght@500&family=Scheherazade+New:wght@500&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe7fb;--pn:rgba(255,255,255,.55);--fl:rgba(255,255,255,.5);--ink:#26104a;--mute:#6b5a8c;--line:rgba(109,40,217,.28);--glow:rgba(109,40,217,.25);--ac:#6d28d9;--ac2:#a21caf;--gold:#a8601a;--on:#fff;--o1:#c4a1ff;--o2:#ffb3e1;--d:1;--fn:'IBM Plex Sans Arabic';color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0618;--pn:rgba(255,255,255,.08);--fl:rgba(255,255,255,.07);--ink:#f1e8ff;--mute:#b6a3d9;--line:rgba(255,255,255,.2);--glow:rgba(167,110,255,.4);--ac:#b98aff;--ac2:#e879f9;--gold:#ffd37a;--on:#1a0a33;--o1:#7c3aed;--o2:#db2777;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0618;--pn:rgba(255,255,255,.08);--fl:rgba(255,255,255,.07);--ink:#f1e8ff;--mute:#b6a3d9;--line:rgba(255,255,255,.2);--glow:rgba(167,110,255,.4);--ac:#b98aff;--ac2:#e879f9;--gold:#ffd37a;--on:#1a0a33;--o1:#7c3aed;--o2:#db2777;color-scheme:dark}
html[dir='rtl']{--d:-1}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--fn),system-ui,sans-serif;display:flex;justify-content:center}
body::before,body::after{content:"";position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(80px);opacity:.6;z-index:-1;pointer-events:none}
body::before{background:var(--o1);top:-100px;inset-inline-start:-100px;animation:f1 16s ease-in-out infinite alternate}
body::after{background:var(--o2);bottom:-120px;inset-inline-end:-100px;animation:f2 20s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(120px,180px) scale(1.2)}}
@keyframes f2{to{transform:translate(-140px,-160px) scale(1.15)}}
.app{width:100%;max-width:460px;padding:14px 14px 104px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.win{position:relative;isolation:isolate;border-radius:26px;background:var(--pn);border:1px solid var(--line);padding:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.1),0 18px 40px -16px var(--glow);-webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%)}
.win::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,0) 42%);pointer-events:none}
.win h2{margin:0 0 10px;font-size:15px;font-weight:500;color:var(--ac);border-bottom:1px solid var(--line);padding-bottom:8px}
#v{display:flex;flex-direction:column;gap:14px}
#v.go>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(6px)}}
#hd{display:flex;align-items:center;gap:12px;padding:10px 12px}
#hd b{display:block;font-size:15px}#hd small{color:var(--mute);font-size:12px}
.lo{flex:none;width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 4px 8px var(--glow))}
.xp{flex:1;height:10px;border-radius:99px;background:var(--fl);overflow:hidden}
.xp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 12px var(--glow)}
.bell{position:relative;flex:none;width:40px;height:40px;border:1px solid var(--line);background:var(--fl);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bell svg,nav svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.bell svg{width:22px;height:22px;stroke-width:1.7}
.bell i{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--ac2);color:var(--on);font:500 11px/18px sans-serif;text-align:center}
.pb,.row,.seg button,.zc,.btns button,.chip,.sb,.mh button,.qbar button,.qbar select,.sti{border-radius:18px;background:var(--fl);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,background .25s;color:var(--ink)}
.pb:active,.row:active,.zc:active,.chip:active,.sb:active,.ct:active,.sti:active{transform:scale(.97)}
[aria-pressed="true"].chip,[aria-pressed="true"].seg>button,.seg button[aria-pressed="true"],.qbar button[aria-pressed="true"]{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:var(--on)}
.row{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:start;padding:12px;margin-top:10px;font-size:15px}
.row b{font-weight:500;color:var(--gold);font-size:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;padding:10px;min-width:80px}
.sl{margin:12px 0 8px;color:var(--mute);font-size:13px}
.nxt{margin:0 0 10px;color:var(--gold);font-size:15px}
.mh{display:flex;align-items:center;gap:10px}.mh h2{flex:1;margin:0;border:0;padding:0;text-align:center;font-size:18px;color:var(--ink)}.mh button{padding:8px 14px;font-size:13px}
/* neon system window */
.sysw{border-color:var(--ac);background:linear-gradient(180deg,rgba(14,8,40,.78),rgba(8,4,26,.86));box-shadow:0 0 0 1px rgba(255,255,255,.07) inset,0 0 26px var(--glow),0 0 70px -14px var(--glow);color:#eaf0ff}
.sysw h3{margin:0 auto 12px;display:table;border:1px solid var(--ac);padding:5px 28px;letter-spacing:.06em;font-weight:500;font-size:17px;text-shadow:0 0 12px var(--ac);color:#fff}
.sysw::after{content:"";position:absolute;left:8%;right:8%;top:-3px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--ac),#fff,var(--ac),transparent);box-shadow:0 0 14px var(--ac);pointer-events:none}
.sysw .mute{color:#aab6e0}
/* home */
.hero{text-align:center}
.nxl{margin:0;color:var(--mute);font-size:13px}.nxn{margin:2px 0;border:0;padding:0;font-size:26px;color:var(--ink)}
.cd{font-size:44px;font-weight:500;font-variant-numeric:tabular-nums;direction:ltr;color:var(--ink);text-shadow:0 0 22px var(--glow);letter-spacing:.02em}
.pt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pc{border:1px solid var(--line);background:var(--fl);border-radius:16px;padding:9px 4px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
.pc b{font-size:15px;font-weight:500;color:var(--ink);direction:ltr;font-variant-numeric:tabular-nums}.pc small{font-size:11px;min-height:14px}
.pc.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}.pc.on span,.pc.on b,.pc.on small{color:var(--on)}
.qn{text-align:center;margin:0 0 6px;font-size:14px;color:#aab6e0}
.goal{text-align:center;font-size:24px;letter-spacing:.2em;margin:6px 0 10px;color:#fff;text-shadow:0 0 14px var(--ac)}
.ql{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ql li{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.ql .qnm{flex:1}.ql .qv{color:#9fc2ff;direction:ltr;font-variant-numeric:tabular-nums}
.ql button{border:1px solid var(--ac);background:transparent;border-radius:12px;padding:5px 12px;font-size:12.5px;color:#fff;min-width:78px}
.ql button.go{background:var(--ac);color:var(--on)}.ql button:disabled{opacity:.55}
.ql .ok{color:#7dffb0}.ql li.dn .qnm{opacity:.6}
.qdone{text-align:center;margin:12px 0 0;color:#fff;text-shadow:0 0 10px var(--ac)}
/* azkar */
.cts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ct{position:relative;overflow:hidden;border:0;border-radius:20px;min-height:132px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-size:17px;font-weight:500;text-align:start;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -10px var(--glow);transition:transform .15s}
.ct.w2{grid-column:1/-1;min-height:110px}
.ct svg{position:absolute;inset-inline-start:10px;top:10px;width:92px;height:92px;fill:none;stroke:rgba(255,255,255,.55);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ct span{position:relative}
.zc{width:100%;display:flex;flex-direction:column;gap:8px;text-align:start;padding:14px;margin-top:10px}
.zt{font-family:'Noto Naskh Arabic',serif;font-size:20px;line-height:2;font-weight:500;direction:rtl}
.zl{display:block;font-family:var(--fn),sans-serif;font-size:13px;color:var(--gold);font-weight:400;margin-bottom:4px}
.zc b{color:var(--gold);font-weight:500;font-size:14px}.zc.d{opacity:.55}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;font-size:14px;border-radius:999px}
.dh{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:28px;text-align:center;margin:8px 0;min-height:52px}
.stage{position:relative;width:250px;height:250px;margin:0 auto}
.stage svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tr{fill:none;stroke:var(--fl);stroke-width:8}.br{fill:none;stroke:var(--ac);stroke-width:8;stroke-linecap:round;stroke-dasharray:691.2;transition:stroke-dashoffset .2s;filter:drop-shadow(0 0 7px var(--glow))}
.tap{position:absolute;inset:20px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),rgba(255,255,255,.05) 55%),var(--pn);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -14px 34px var(--glow),0 18px 40px -12px var(--glow);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;animation:mb 8s ease-in-out infinite;transition:transform .08s}
.tap:active{transform:scale(.94)}
@keyframes mb{0%,100%{border-radius:50%}33%{border-radius:46% 54% 50% 50%/54% 46% 54% 46%}66%{border-radius:54% 46% 48% 52%/46% 54% 46% 54%}}
.num{font-size:64px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--glow)}.of{font-size:14px;color:var(--mute);margin-top:6px}
.msg{min-height:22px;text-align:center;color:var(--gold);margin:10px 0 0}
.btns{display:flex;gap:10px;justify-content:center}.btns button{padding:9px 16px;font-size:14px}
/* mushaf */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;font-size:14px}.sb b{color:var(--gold);font-weight:500;font-size:12px}
.qbar{display:flex;gap:8px;flex-wrap:wrap}.qbar button,.qbar select{padding:8px 12px;font-size:13px}.qbar select{flex:1;min-width:120px}
.pg{direction:rtl;background:#fbf6e6;color:#16130a;border:11px solid transparent;border-image:repeating-linear-gradient(45deg,#c0392b 0 6px,#f6c84c 6px 12px,#1e8a8a 12px 18px,#8e44ad 18px 24px,#2a6fd6 24px 30px) 11;box-shadow:0 18px 40px -14px var(--glow);padding:10px 12px 8px;outline:3px solid #c0392b;outline-offset:-14px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(180deg,#1f6b3a,#14502b);border:2px solid #d9b84f;border-radius:10px;color:#fff;padding:6px 10px;margin-bottom:10px;font-family:'Amiri',serif;font-size:21px}
.sh i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#0e3a1f;border:2px solid #d9b84f;display:flex;align-items:center;justify-content:center;font-size:14px}
.qr,.qt,.bs{font-family:'Amiri','Noto Naskh Arabic',serif}
.qt{font-size:25px;line-height:2.5;text-align:justify;margin:0}.bs{text-align:center;font-size:26px;margin:0 0 6px;color:#14502b}
.an{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid #b8892b;background:#bfe3f5;color:#1a3a5c;font:600 13px sans-serif;margin:0 3px;vertical-align:middle}
.ay{border-bottom:1px solid #d9cfa6;padding:6px 0}.tf{font-family:'Noto Naskh Arabic',serif;font-size:16px;line-height:1.9;color:#3b3520;background:#f1e8c6;border-radius:10px;padding:8px 10px;margin:4px 0}
.pf{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #d9cfa6;margin-top:8px;padding-top:6px;font-size:13px;color:#5a4f2a}
.qerr{color:#a33;text-align:center}
/* profile */
.sth{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:10px}.sth h3{margin:0}
.gear{position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);border:0;background:none;color:#cdd8ff;width:36px;height:36px}.gear svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.stb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(120,160,255,.5);border-bottom:1px solid rgba(120,160,255,.5)}
.stb p{margin:6px 0;font-size:15px}
.av{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:var(--fl);border:2px solid var(--line);margin-bottom:6px}
.av.gold{border-color:#f2c14e;box-shadow:0 0 14px #f2c14e}.av.em{border-color:#34d399;box-shadow:0 0 14px #34d399}.av.neon{border-color:#a45cff;box-shadow:0 0 18px #a45cff,0 0 32px #4f8cff}.av.royal{border:3px double #ffd37a;box-shadow:0 0 16px #db2777}
.rb{position:relative;width:78px;height:78px;flex:none}.rb i{position:absolute;inset:10px;border:2px solid #3d8bff;box-shadow:0 0 10px #3d8bff}.rb i:first-child{transform:rotate(14deg)}.rb i:nth-child(2){transform:rotate(-8deg)}.rb b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;text-shadow:0 0 12px #3d8bff}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;padding:10px 0;border-bottom:1px solid rgba(120,160,255,.5)}.sts p{margin:4px 0;font-size:14px}
.rad{display:block;margin:6px auto;width:230px;max-width:100%}.rad text{fill:#cdd8ff;font-size:11px;font-family:var(--fn),sans-serif}
.stf p{margin:8px 0;text-align:center;font-size:14px}
.nm{width:100%;border:1px solid var(--line);background:var(--fl);border-radius:14px;padding:11px;font:inherit;color:var(--ink);margin-bottom:10px}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}.avg button{border:1px solid var(--line);background:var(--fl);border-radius:14px;font-size:26px;padding:6px 0}.avg button[aria-pressed="true"]{outline:3px solid var(--ac)}
.btn{width:100%;border:0;border-radius:16px;padding:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font-size:15px}
/* store + settings */
.coin{text-align:center;font-size:20px;margin:0 0 8px;color:var(--gold)}
.stg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sti{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;font-size:14px}.sti b{font-weight:500;color:var(--gold);font-size:13px}.sti[aria-pressed="true"]{outline:2px solid var(--ac)}.sti .e{font-size:30px}
.sws{display:flex;gap:6px;flex-wrap:wrap}.sw{flex:1;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:4px 0;font-size:12px;color:var(--ink)}
.sw i{display:block;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 6px 14px -4px var(--glow)}.sw[aria-pressed='true'] i{outline:3px solid var(--ink);outline-offset:3px}
.fnt{font-size:16px}
/* panels */
nav{position:fixed;inset:auto 0 0 0;width:min(400px,calc(100% - 16px));margin:0 auto 10px;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-radius:34px;background:var(--pn);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.2),0 12px 32px -8px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(30px) saturate(210%) brightness(1.05);backdrop-filter:blur(30px) saturate(210%) brightness(1.05);z-index:10}
nav button{flex:1;border:0;background:transparent;padding:9px 0 7px;border-radius:26px;color:var(--ink);font-size:9.5px;line-height:1.3;transition:background .3s,color .3s,transform .3s}
nav svg{display:block;margin:0 auto 3px;width:21px;height:21px;stroke-width:1.6}
nav button[aria-pressed="true"]{color:var(--ac);background:radial-gradient(ellipse at 50% 70%,var(--glow),transparent 72%),var(--fl);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),inset 0 0 16px var(--glow);transform:scale(1.06)}
#npx,#ppx,#sxx{position:fixed;inset:0;z-index:40;background:rgba(10,4,24,.42);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .5s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#npx.open,#ppx.open,#sxx.open{opacity:1;visibility:visible;transition:opacity .4s,visibility 0s}
#np,#pp,#sx{position:fixed;top:50%;inset-inline:0;margin-inline:auto;width:min(92vw,400px);max-height:80vh;z-index:41;transform:translateY(-50%) scaleY(0);transform-origin:center;opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .3s,visibility 0s .5s}
#np.open,#pp.open,#sx.open{transform:translateY(-50%) scaleY(1);opacity:1;visibility:visible;transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .3s,visibility 0s}
@keyframes pulse{50%{box-shadow:0 0 44px var(--glow),0 0 110px -6px var(--glow),inset 0 0 54px rgba(130,90,255,.2)}}
.nph{display:flex;justify-content:space-between;align-items:center}.nph h2{margin:0;font-size:18px;font-weight:500;text-shadow:0 0 12px var(--ac)}
#npc{width:36px;height:36px;border-radius:50%;border:1px solid var(--ac);background:transparent;font-size:22px;line-height:1;color:#fff}
#npl{list-style:none;margin:0;padding:0;overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px}
#npl li{display:flex;justify-content:space-between;gap:10px;border:1px solid rgba(120,160,255,.4);background:rgba(255,255,255,.05);border-radius:14px;padding:12px;font-size:14px}
#npl small{color:#9fb0e0;flex:none}#npl .em{justify-content:center;color:#9fb0e0}
.npf{display:flex;gap:8px}.npf button{flex:1;border:1px solid var(--ac);background:transparent;border-radius:14px;padding:10px;font-size:13px;color:#fff}
#w{position:fixed;inset:0;background:rgba(6,2,18,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
#w[hidden]{display:none}
#w .nfo{width:100%;max-width:400px;animation:vopen .5s cubic-bezier(.2,.9,.3,1)}
@keyframes vopen{from{transform:scaleY(0);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px);filter:blur(10px)}}
#wb p{margin:6px 0;text-align:center;color:#c4d0f5;line-height:1.7}
#ok{display:block;margin:14px auto 0;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);border-radius:16px;padding:11px 34px}
#t{position:fixed;top:0;left:50%;transform:translate(-50%,-20px);padding-top:env(safe-area-inset-top,0px);opacity:0;pointer-events:none;transition:.25s;z-index:70;width:calc(100% - 28px);max-width:420px}
#t span{display:block;margin-top:8px;border:1px solid var(--ac);background:rgba(10,6,30,.85);color:#fff;box-shadow:0 0 18px var(--glow);border-radius:18px;padding:10px 14px;font-size:14px;text-align:center;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#t.on{opacity:1;transform:translate(-50%,0)}

['أصبحنا وأصبح الملك لله والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذا اليوم وخير ما بعده، وأعوذ بك من شر ما في هذا اليوم وشر ما بعده، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب في النار وعذاب في القبر',1,'','رواه مسلم','أمسينا وأمسى الملك لله والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذه الليلة وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة وشر ما بعدها، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب في النار وعذاب في القبر'],
['اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور',1,'','رواه الترمذي','اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير'],
['اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي، وأبوء بذنبي فاغفر لي، فإنه لا يغفر الذنوب إلا أنت',1,'من قالها موقناً بها حين يصبح فمات من يومه دخل الجنة، ومن قالها موقناً بها حين يمسي فمات من ليلته دخل الجنة.','رواه البخاري'],
['اللهم إني أصبحت أشهدك وأشهد حملة عرشك وملائكتك وجميع خلقك، أنك أنت الله لا إله إلا أنت وحدك لا شريك لك، وأن محمداً عبدك ورسولك',4,'من قالها حين يصبح أو يمسي أعتقه الله من النار.','رواه أبو داود','اللهم إني أمسيت أشهدك وأشهد حملة عرشك وملائكتك وجميع خلقك، أنك أنت الله لا إله إلا أنت وحدك لا شريك لك، وأن محمداً عبدك ورسولك'],
['اللهم ما أصبح بي من نعمة أو بأحد من خلقك فمنك وحدك لا شريك لك، فلك الحمد ولك الشكر',1,'من قالها حين يصبح فقد أدى شكر يومه، ومن قالها حين يمسي فقد أدى شكر ليلته.','رواه أبو داود','اللهم ما أمسى بي من نعمة أو بأحد من خلقك فمنك وحدك لا شريك لك، فلك الحمد ولك الشكر'],
['اللهم عافني في بدني، اللهم عافني في سمعي، اللهم عافني في بصري، لا إله إلا أنت',3,'','رواه أبو داود'],
['اللهم إني أعوذ بك من الكفر والفقر، وأعوذ بك من عذاب القبر، لا إله إلا أنت',3,'','رواه أبو داود'],
['حسبي الله لا إله إلا هو، عليه توكلت وهو رب العرش العظيم',7,'من قالها حين يصبح وحين يمسي سبع مرات كفاه الله ما أهمه من أمر الدنيا والآخرة.','رواه أبو داود'],
['اللهم إني أسألك العفو والعافية في الدنيا والآخرة، اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي، اللهم استر عوراتي وآمن روعاتي، اللهم احفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي، وأعوذ بعظمتك أن أغتال من تحتي',1,'','رواه أبو داود وابن ماجه'],
['اللهم عالم الغيب والشهادة فاطر السماوات والأرض، رب كل شيء ومليكه، أشهد أن لا إله إلا أنت، أعوذ بك من شر نفسي ومن شر الشيطان وشركه، وأن أقترف على نفسي سوءاً أو أجره إلى مسلم',1,'','رواه الترمذي وأبو داود'],
['بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم',3,'من قالها ثلاث مرات حين يصبح وثلاث مرات حين يمسي لم يضره شيء.','رواه أبو داود والترمذي'],
['رضيت بالله رباً، وبالإسلام ديناً، وبمحمد صلى الله عليه وسلم نبياً',3,'من قالها ثلاثاً حين يصبح وحين يمسي كان حقاً على الله أن يرضيه يوم القيامة.','رواه أحمد'],
['يا حي يا قيوم برحمتك أستغيث، أصلح لي شأني كله، ولا تكلني إلى نفسي طرفة عين',1,'','رواه الحاكم'],
['أصبحنا على فطرة الإسلام، وعلى كلمة الإخلاص، وعلى دين نبينا محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم حنيفاً مسلماً وما كان من المشركين',1,'','رواه أحمد','أمسينا على فطرة الإسلام، وعلى كلمة الإخلاص، وعلى دين نبينا محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم حنيفاً مسلماً وما كان من المشركين'],
['سبحان الله وبحمده',100,'من قالها حين يصبح وحين يمسي مائة مرة لم يأت أحد يوم القيامة بأفضل مما جاء به إلا أحد قال مثل ما قال أو زاد عليه.','رواه مسلم'],
['لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير',10,'من قالها عشر مرات كان كمن أعتق أربعة أنفس من ولد إسماعيل.','رواه البخاري ومسلم'],
['سبحان الله وبحمده، عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته',3,'','رواه مسلم'],
['اللهم إني أسألك علماً نافعاً، ورزقاً طيباً، وعملاً متقبلاً',1,'','رواه ابن ماجه','','m'],
['أعوذ بكلمات الله التامات من شر ما خلق',3,'من قالها حين يمسي ثلاث مرات لم تضره حمة تلك الليلة.','رواه أحمد','','e'],
['أستغفر الله وأتوب إليه',100,'','رواه البخاري'],
['اللهم صل وسلم على نبينا محمد',10,'من صلى علي حين يصبح وحين يمسي عشراً أدركته شفاعتي يوم القيامة.','رواه الطبراني']];

nm:[[K1,1,'من قرأها إذا أوى إلى فراشه لم يزل عليه من الله حافظ، ولا يقربه شيطان حتى يصبح.','رواه البخاري'],[I1,3,'يجمع كفيه ثم ينفث فيهما فيقرأ فيهما، ثم يمسح بهما ما استطاع من جسده، يبدأ بهما على رأسه ووجهه وما أقبل من جسده، يفعل ذلك ثلاث مرات.','رواه البخاري'],[F1,3,'','رواه البخاري'],[N1,3,'','رواه البخاري'],[BQ,1,'من قرأهما في ليلة كفتاه.','متفق عليه'],
['باسمك ربي وضعت جنبي وبك أرفعه، فإن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين',1,'','متفق عليه'],
['اللهم إنك خلقت نفسي وأنت توفاها، لك مماتها ومحياها، إن أحييتها فاحفظها، وإن أمتها فاغفر لها، اللهم إني أسألك العافية',1,'','رواه مسلم'],
['اللهم قني عذابك يوم تبعث عبادك',3,'','رواه أبو داود'],['باسمك اللهم أموت وأحيا',1,'','رواه البخاري'],
['سبحان الله (33)، الحمد لله (33)، الله أكبر (34)',1,'','متفق عليه'],
['الحمد لله الذي أطعمنا وسقانا وكفانا وآوانا، فكم ممن لا كافي له ولا مؤوي',1,'','رواه مسلم'],
['اللهم أسلمت نفسي إليك، وفوضت أمري إليك، وألجأت ظهري إليك، رغبة ورهبة إليك، لا ملجأ ولا منجا منك إلا إليك، آمنت بكتابك الذي أنزلت، وبنبيك الذي أرسلت',1,'من قالهن ثم مات من ليلته مات على الفطرة.','متفق عليه']],
wk:[['الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور',1,'','رواه البخاري'],['لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر، ولا حول ولا قوة إلا بالله',1,'من تعار من الليل فقالها ثم قال: اللهم اغفر لي، أو دعا استجيب له.','رواه البخاري'],['الحمد لله الذي عافاني في جسدي، ورد علي روحي، وأذن لي بذكره',1,'','رواه الترمذي']],
as:[['أستغفر الله',3,'','رواه مسلم'],['اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام',1,'','رواه مسلم'],['لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجد منك الجد',1,'','متفق عليه'],['لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، لا حول ولا قوة إلا بالله، لا إله إلا الله ولا نعبد إلا إياه، له النعمة وله الفضل وله الثناء الحسن، لا إله إلا الله مخلصين له الدين ولو كره الكافرون',1,'','رواه مسلم'],['سبحان الله',33,'من سبح الله دبر كل صلاة ثلاثاً وثلاثين، وحمد الله ثلاثاً وثلاثين، وكبر الله ثلاثاً وثلاثين، فتلك تسعة وتسعون.','رواه مسلم'],['الحمد لله',33,'','رواه مسلم'],['الله أكبر',33,'','رواه مسلم'],['لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير',1,'تمام المائة، غفرت خطاياه وإن كانت مثل زبد البحر.','رواه مسلم'],[K1,1,'من قرأها دبر كل صلاة لم يمنعه من دخول الجنة إلا الموت.','رواه النسائي'],[I1,1,'ثلاث مرات بعد الفجر والمغرب.','رواه أبو داود والنسائي'],[F1,1,'','رواه أبو داود والنسائي'],[N1,1,'','رواه أبو داود والنسائي'],['اللهم أعني على ذكرك وشكرك وحسن عبادتك',1,'','رواه أبو داود والنسائي']],
mj:[['أعوذ بالله العظيم، وبوجهه الكريم، وسلطانه القديم، من الشيطان الرجيم. بسم الله، والصلاة والسلام على رسول الله، اللهم افتح لي أبواب رحمتك',1,'دعاء دخول المسجد، يقدّم رجله اليمنى.','رواه أبو داود ومسلم'],['بسم الله، والصلاة والسلام على رسول الله، اللهم إني أسألك من فضلك، اللهم اعصمني من الشيطان الرجيم',1,'دعاء الخروج من المسجد، يقدّم رجله اليسرى.','رواه ابن ماجه ومسلم'],['اللهم اجعل في قلبي نوراً، وفي لساني نوراً، واجعل في سمعي نوراً، واجعل في بصري نوراً، واجعل من خلفي نوراً، ومن أمامي نوراً، واجعل من فوقي نوراً، ومن تحتي نوراً، اللهم أعطني نوراً',1,'دعاء الذهاب إلى المسجد.','رواه مسلم']],
qd:[['رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',1,'','البقرة (201)'],['رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ',1,'','البقرة (250)'],['رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ',1,'','البقرة (286)'],['رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ',1,'','آل عمران (8)'],['رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ',1,'','آل عمران (16)'],['رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ',1,'','آل عمران (53)'],['رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ',1,'','آل عمران (147)'],['رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ',1,'','آل عمران (191)'],['رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ',1,'','الأعراف (23)'],['رَبَّنَا لَا تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ',1,'','الأعراف (47)'],['حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',1,'','التوبة (129)'],['رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ',1,'','إبراهيم (40)'],['رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ',1,'','إبراهيم (41)'],['رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا',1,'','الإسراء (24)'],['رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا',1,'','الكهف (10)'],['رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي ۝ وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي ۝ يَفْقَهُوا قَوْلِي',1,'','طه (25-28)'],['رَّبِّ زِدْنِي عِلْمًا',1,'','طه (114)'],['لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ',1,'','الأنبياء (87)'],['رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ',1,'','القصص (24)'],['رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا',1,'','الفرقان (74)'],['رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ ۖ إِنَّ عَذَابَهَا كَانَ غَرَامًا',1,'','الفرقان (65)'],['رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي ۖ إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ',1,'','الأحقاف (15)'],['رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ',1,'','الحشر (10)'],['رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ الْمَصِيرُ',1,'','الممتحنة (4)'],['رَبَّنَا أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَا ۖ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ',1,'','التحريم (8)']],
du:[['اللهم إني أعوذ بك من الهم والحزن، والعجز والكسل، والبخل والجبن، وضلع الدين وغلبة الرجال',1,'','رواه البخاري'],['اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي، واجعل الحياة زيادة لي في كل خير، واجعل الموت راحة لي من كل شر',1,'','رواه مسلم'],['اللهم إني أسألك الهدى والتقى والعفاف والغنى',1,'','رواه مسلم'],['اللهم أعني على ذكرك وشكرك وحسن عبادتك',1,'','رواه أبو داود'],['يا مقلب القلوب ثبت قلبي على دينك',3,'','رواه الترمذي'],['اللهم مصرف القلوب صرف قلوبنا على طاعتك',1,'','رواه مسلم'],['اللهم إنك عفو تحب العفو فاعف عني',3,'','رواه الترمذي'],['اللهم إني أعوذ بك من علم لا ينفع، ومن قلب لا يخشع، ومن نفس لا تشبع، ومن دعوة لا يستجاب لها',1,'','رواه مسلم'],['اللهم إني أعوذ بك من زوال نعمتك، وتحول عافيتك، وفجاءة نقمتك، وجميع سخطك',1,'','رواه مسلم'],['اللهم اغفر لي خطيئتي وجهلي، وإسرافي في أمري، وما أنت أعلم به مني، اللهم اغفر لي جدي وهزلي، وخطئي وعمدي، وكل ذلك عندي',1,'','متفق عليه'],['اللهم إني أسألك الجنة وما قرب إليها من قول أو عمل، وأعوذ بك من النار وما قرب إليها من قول أو عمل',1,'','رواه ابن ماجه'],['اللهم إني ظلمت نفسي ظلماً كثيراً، ولا يغفر الذنوب إلا أنت، فاغفر لي مغفرة من عندك وارحمني، إنك أنت الغفور الرحيم',1,'','متفق عليه'],['لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم',1,'دعاء الكرب.','رواه البخاري ومسلم'],['اللهم رحمتك أرجو، فلا تكلني إلى نفسي طرفة عين، وأصلح لي شأني كله، لا إله إلا أنت',1,'','رواه أبو داود'],['اللهم إني أسألك الثبات في الأمر، والعزيمة على الرشد، وأسألك شكر نعمتك وحسن عبادتك، وأسألك قلباً سليماً ولساناً صادقاً، وأسألك من خير ما تعلم، وأعوذ بك من شر ما تعلم، وأستغفرك لما تعلم',1,'','رواه النسائي وأحمد'],['اللهم أحسن عاقبتنا في الأمور كلها، وأجرنا من خزي الدنيا وعذاب الآخرة',1,'','رواه أحمد'],['اللهم لك أسلمت، وبك آمنت، وعليك توكلت، وإليك أنبت، وبك خاصمت، أعوذ بعزتك لا إله إلا أنت أن تضلني، أنت الحي الذي لا يموت، والجن والإنس يموتون',1,'','رواه مسلم']],
tr:[['الله أكبر، الله أكبر، الله أكبر، سبحان الذي سخر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون. اللهم إنا نسألك في سفرنا هذا البر والتقوى، ومن العمل ما ترضى، اللهم هون علينا سفرنا هذا واطو عنا بعده، اللهم أنت الصاحب في السفر، والخليفة في الأهل، اللهم إني أعوذ بك من وعثاء السفر، وكآبة المنظر، وسوء المنقلب في المال والأهل',1,'دعاء السفر.','رواه مسلم'],['آيبون تائبون عابدون لربنا حامدون',1,'يزيدها عند الرجوع من السفر.','رواه مسلم'],['أعوذ بكلمات الله التامات من شر ما خلق',1,'من نزل منزلاً ثم قالها لم يضره شيء حتى يرتحل من منزله ذلك.','رواه مسلم'],['اللهم رب السماوات السبع وما أظللن، ورب الأرضين السبع وما أقللن، ورب الشياطين وما أضللن، ورب الرياح وما ذرين، أسألك خير هذه القرية وخير أهلها وخير ما فيها، وأعوذ بك من شرها وشر أهلها وشر ما فيها',1,'عند دخول قرية أو بلدة.','رواه الحاكم'],['بسم الله، والحمد لله، سبحان الذي سخر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون، الحمد لله، الحمد لله، الحمد لله، الله أكبر ثلاثاً، سبحانك إني ظلمت نفسي فاغفر لي فإنه لا يغفر الذنوب إلا أنت',1,'عند ركوب الدابة أو المركبة.','رواه أبو داود والترمذي']],
rq:[['بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝ الرَّحْمَٰنِ الرَّحِيمِ ۝ مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ',1,'سورة الفاتحة.','رواه البخاري ومسلم'],[K1,1,'','رواه البخاري'],[BQ,1,'','متفق عليه'],[I1,3,'','رواه أبو داود'],[F1,3,'','رواه أبو داود'],[N1,3,'','رواه أبو داود'],
['بسم الله أرقيك، من كل شيء يؤذيك، من شر كل نفس أو عين حاسد، الله يشفيك، بسم الله أرقيك',3,'','رواه مسلم'],['بسم الله يبريك، ومن كل داء يشفيك، ومن شر حاسد إذا حسد، ومن شر كل ذي عين',1,'','رواه مسلم'],['أسأل الله العظيم رب العرش العظيم أن يشفيك',7,'ما من عبد مسلم يعود مريضاً لم يحضر أجله فيقول ذلك سبع مرات إلا عافاه الله من ذلك المرض.','رواه أبو داود والترمذي'],['أعوذ بالله وقدرته من شر ما أجد وأحاذر',7,'يضع يده على موضع الألم ويقول قبلها: بسم الله ثلاثاً.','رواه مسلم'],['أعوذ بكلمات الله التامة من كل شيطان وهامة، ومن كل عين لامة',3,'','رواه البخاري'],['بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم',3,'','رواه أبو داود والترمذي'],['اللهم رب الناس، أذهب البأس، واشف أنت الشافي، لا شفاء إلا شفاؤك، شفاءً لا يغادر سقماً',1,'','متفق عليه'],['أعوذ بكلمات الله التامات من شر ما خلق',3,'','رواه مسلم']]};
